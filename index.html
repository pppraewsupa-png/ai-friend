<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AI Friend</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap');

:root{
  --bg:#1B1830;
  --bg-elevated:#241F3D;
  --bg-input:#2A2447;
  --accent:#E8A87C;
  --accent-deep:#B4744A;
  --accent-soft:rgba(232,168,124,.16);
  --text:#F2EFEA;
  --text-muted:#8E88AC;
  --bubble-ai:#2A2447;
  --border:rgba(242,239,234,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:var(--bg);
}

body{
  font-family:'Noto Sans Thai',sans-serif;
  color:var(--text);
}

.companion-app{
  width:100%;
  height:100dvh;
  min-height:500px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg);
}

/* HEADER */

.ca-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:
    max(14px,env(safe-area-inset-top))
    16px 14px;

  background:linear-gradient(
    180deg,
    var(--bg-elevated),
    var(--bg)
  );

  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.ca-orb{
  width:42px;
  height:42px;
  border-radius:50%;
  flex-shrink:0;

  background:
    radial-gradient(
      circle at 32% 30%,
      var(--accent),
      var(--accent-deep) 75%
    );

  box-shadow:0 0 18px var(--accent-soft);

  animation:breathe 4.2s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.08);
    opacity:.85;
  }
}

.ca-header-info{
  flex:1;
  min-width:0;
}

.ca-name{
  font-family:'Kanit',sans-serif;
  font-weight:600;
  font-size:17px;
}

.ca-status{
  font-size:12px;
  color:var(--text-muted);
  margin-top:2px;
}

.ca-settings-btn{
  width:40px;
  height:40px;

  border:0;
  border-radius:10px;

  background:none;
  color:var(--text-muted);

  font-size:21px;

  cursor:pointer;
}

/* CHAT */

.ca-chat{
  flex:1;
  overflow-y:auto;

  padding:18px 14px;

  display:flex;
  flex-direction:column;
  gap:10px;

  -webkit-overflow-scrolling:touch;
}

.ca-empty{
  margin:auto;
  text-align:center;

  color:var(--text-muted);

  font-size:13px;
  line-height:1.7;

  padding:24px;
}

.ca-empty b{
  color:var(--text);
  font-family:'Kanit',sans-serif;
}

.ca-row{
  display:flex;
  width:100%;
}

.ca-row.user{
  justify-content:flex-end;
}

.ca-row.ai{
  justify-content:flex-start;
}

.ca-bubble{
  max-width:82%;

  padding:10px 14px;

  border-radius:16px;

  font-size:14.5px;
  line-height:1.55;

  white-space:pre-wrap;
  word-break:break-word;
}

.ca-row.user .ca-bubble{
  background:var(--accent);
  color:#241708;

  border-bottom-right-radius:5px;
}

.ca-row.ai .ca-bubble{
  background:var(--bubble-ai);

  color:var(--text);

  border:1px solid var(--border);

  border-bottom-left-radius:5px;
}

.ca-time{
  font-size:10px;
  color:var(--text-muted);

  margin-top:3px;
  padding:0 4px;
}

.ca-row.user .ca-time{
  text-align:right;
}

/* TYPING */

.ca-typing{
  display:flex;
  gap:4px;

  padding:12px 14px;

  background:var(--bubble-ai);

  border-radius:16px;
  border-bottom-left-radius:5px;

  border:1px solid var(--border);

  width:fit-content;
}

.ca-typing span{
  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--text-muted);

  animation:blink 1.2s infinite;
}

.ca-typing span:nth-child(2){
  animation-delay:.15s;
}

.ca-typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes blink{
  0%,80%,100%{
    opacity:.25;
  }

  40%{
    opacity:1;
  }
}

/* INPUT */

.ca-inputbar{
  display:flex;
  align-items:flex-end;
  gap:8px;

  padding:
    10px 12px
    max(10px,env(safe-area-inset-bottom));

  background:var(--bg-elevated);

  border-top:1px solid var(--border);

  flex-shrink:0;
}

.ca-textarea{
  flex:1;

  min-height:42px;
  max-height:120px;

  resize:none;

  background:var(--bg-input);
  color:var(--text);

  border:1px solid var(--border);
  border-radius:14px;

  padding:10px 14px;

  font-family:inherit;
  font-size:15px;

  line-height:1.4;
}

.ca-textarea:focus{
  outline:none;
  border-color:var(--accent);
}

.ca-textarea::placeholder{
  color:var(--text-muted);
}

.ca-send{
  width:42px;
  height:42px;

  border-radius:50%;
  border:none;

  background:var(--accent);
  color:#241708;

  font-size:17px;

  cursor:pointer;
}

.ca-send:disabled{
  opacity:.4;
}

/* SETTINGS */

.ca-overlay{
  position:absolute;
  inset:0;

  background:rgba(10,8,20,.6);

  display:none;

  align-items:flex-end;

  z-index:10;
}

.ca-overlay.open{
  display:flex;
}

.ca-sheet{
  width:100%;

  background:var(--bg-elevated);

  border-radius:20px 20px 0 0;

  padding:
    20px 18px
    max(22px,env(safe-area-inset-bottom));

  max-height:90%;

  overflow-y:auto;
}

.ca-sheet h2{
  font-family:'Kanit',sans-serif;

  font-size:18px;

  margin:0 0 5px;
}

.ca-sub{
  color:var(--text-muted);

  font-size:12px;

  line-height:1.6;

  margin:0 0 18px;
}

.ca-field{
  margin-bottom:15px;
}

.ca-field label{
  display:block;

  font-size:12px;

  color:var(--text-muted);

  margin-bottom:6px;
}

.ca-field input,
.ca-field textarea{
  width:100%;

  background:var(--bg-input);
  color:var(--text);

  border:1px solid var(--border);

  border-radius:10px;

  padding:11px 12px;

  font-family:inherit;
  font-size:15px;
}

.ca-field textarea{
  resize:none;
}

.ca-field input:focus,
.ca-field textarea:focus{
  outline:none;
  border-color:var(--accent);
}

.ca-sheet-actions{
  display:flex;
  gap:10px;

  margin-top:18px;
}

.ca-btn{
  flex:1;

  padding:12px;

  border-radius:12px;

  font-family:inherit;

  font-size:14px;
  font-weight:600;

  border:none;

  cursor:pointer;
}

.ca-btn.primary{
  background:var(--accent);
  color:#241708;
}

.ca-btn.ghost{
  background:transparent;

  color:var(--text-muted);

  border:1px solid var(--border);
}

.ca-btn.danger{
  width:100%;

  background:transparent;

  color:#E88C7C;

  border:1px solid rgba(232,140,124,.3);
}

.ca-divider{
  height:1px;

  background:var(--border);

  margin:18px 0;
}

.ca-api-status{
  margin-top:8px;

  font-size:11px;

  color:var(--text-muted);
}

.ca-api-status.ok{
  color:#8FD6A8;
}

.ca-api-status.error{
  color:#E88C7C;
}
</style>
</head>

<body>

<div class="companion-app">

  <!-- HEADER -->

  <div class="ca-header">

    <div class="ca-orb"></div>

    <div class="ca-header-info">

      <div class="ca-name" id="caName">
        เพื่อน
      </div>

      <div class="ca-status">
        พร้อมคุยด้วยเสมอ
      </div>

    </div>

    <button
      class="ca-settings-btn"
      id="caSettingsBtn">
      ⚙️
    </button>

  </div>


  <!-- CHAT -->

  <div
    class="ca-chat"
    id="caChat">

    <div
      class="ca-empty"
      id="caEmpty">

      สวัสดี 👋<br>

      ที่นี่เป็นพื้นที่ส่วนตัวของคุณ<br>

      คุยอะไรก็ได้
      <b>เพื่อน</b>
      พร้อมรับฟังเสมอ

    </div>

  </div>


  <!-- INPUT -->

  <div class="ca-inputbar">

    <textarea
      class="ca-textarea"
      id="caInput"
      placeholder="พิมพ์อะไรก็ได้..."
      rows="1"></textarea>

    <button
      class="ca-send"
      id="caSend">

      ➤

    </button>

  </div>


  <!-- SETTINGS -->

  <div
    class="ca-overlay"
    id="caOverlay">

    <div class="ca-sheet">

      <h2>
        ตั้งค่าเพื่อนคุย
      </h2>

      <p class="ca-sub">
        ทุกอย่างเก็บไว้ใน browser ของเครื่องนี้
      </p>


      <div class="ca-field">

        <label>
          ชื่อเพื่อนคุย
        </label>

        <input
          id="caNameInput"
          maxlength="20"
          placeholder="เช่น Luna, ฟ้า, มินนี่">

      </div>


      <div class="ca-field">

        <label>
          นิสัย / บุคลิก
        </label>

        <textarea
          id="caPersonaInput"
          rows="4"
          placeholder="เช่น อบอุ่น ขี้เล่น ชอบแซว รับฟังเก่ง"></textarea>

      </div>


      <div class="ca-field">

        <label>
          Anthropic API Key
        </label>

        <input
          id="caApiKeyInput"
          type="password"
          autocomplete="off"
          placeholder="sk-ant-...">

        <div
          class="ca-api-status"
          id="caApiStatus">

          ใช้สำหรับการทดลองส่วนตัวเท่านั้น
        </div>

      </div>


      <div class="ca-sheet-actions">

        <button
          class="ca-btn ghost"
          id="caCancelBtn">

          ยกเลิก

        </button>

        <button
          class="ca-btn primary"
          id="caSaveBtn">

          บันทึก

        </button>

      </div>


      <div class="ca-divider"></div>


      <button
        class="ca-btn danger"
        id="caClearBtn">

        ล้างประวัติการสนทนา

      </button>

    </div>

  </div>

</div>


<script>

(function(){

/* =========================
   DEFAULT
========================= */

const DEFAULT_NAME = "แฟน";

const DEFAULT_PERSONA =
"อบอุ่น หึงหวง ห่วงใย ชอบรับฟัง " +
"ขี้เล่นเล็กน้อย พูดเหมือนแฟน " +
"ใช้ภาษาไทยธรรมชาติ ไม่เป็นทางการ";


/* =========================
   STATE
========================= */

let settings = {

  name:
    localStorage.getItem("friend_name")
    || DEFAULT_NAME,

  persona:
    localStorage.getItem("friend_persona")
    || DEFAULT_PERSONA,

  apiKey:
    localStorage.getItem("friend_api_key")
    || ""

};

let messages =
  JSON.parse(
    localStorage.getItem("friend_messages")
    || "[]"
  );

let sending = false;


/* =========================
   ELEMENTS
========================= */

const chat =
  document.getElementById("caChat");

const empty =
  document.getElementById("caEmpty");

const input =
  document.getElementById("caInput");

const send =
  document.getElementById("caSend");

const name =
  document.getElementById("caName");

const overlay =
  document.getElementById("caOverlay");

const settingsBtn =
  document.getElementById("caSettingsBtn");

const nameInput =
  document.getElementById("caNameInput");

const personaInput =
  document.getElementById("caPersonaInput");

const apiKeyInput =
  document.getElementById("caApiKeyInput");

const apiStatus =
  document.getElementById("caApiStatus");

const saveBtn =
  document.getElementById("caSaveBtn");

const cancelBtn =
  document.getElementById("caCancelBtn");

const clearBtn =
  document.getElementById("caClearBtn");


/* =========================
   INIT
========================= */

name.textContent =
  settings.name;

renderMessages();


/* =========================
   SAVE
========================= */

function saveSettings(){

  settings.name =
    nameInput.value.trim()
    || DEFAULT_NAME;

  settings.persona =
    personaInput.value.trim()
    || DEFAULT_PERSONA;

  settings.apiKey =
    apiKeyInput.value.trim();

  localStorage.setItem(
    "friend_name",
    settings.name
  );

  localStorage.setItem(
    "friend_persona",
    settings.persona
  );

  if(settings.apiKey){

    localStorage.setItem(
      "friend_api_key",
      settings.apiKey
    );

  }else{

    localStorage.removeItem(
      "friend_api_key"
    );

  }

  name.textContent =
    settings.name;

  renderMessages();

}


/* =========================
   MESSAGES
========================= */

function saveMessages(){

  localStorage.setItem(
    "friend_messages",
    JSON.stringify(messages)
  );

}


function time(ts){

  return new Date(ts)
    .toLocaleTimeString(
      "th-TH",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


function renderMessages(){

  chat
    .querySelectorAll(
      ".ca-row,.typing-row"
    )
    .forEach(
      e => e.remove()
    );


  if(messages.length === 0){

    empty.style.display =
      "block";

    empty.innerHTML =
      `สวัสดี 👋<br>
       ที่นี่เป็นพื้นที่ส่วนตัวของคุณ<br>
       คุยอะไรก็ได้
       <b>${escapeHtml(settings.name)}</b>
       พร้อมรับฟังเสมอ`;

    return;

  }


  empty.style.display =
    "none";


  messages.forEach(m => {

    const row =
      document.createElement("div");

    row.className =
      "ca-row " +
      (m.role === "user"
        ? "user"
        : "ai");


    const wrap =
      document.createElement("div");

    wrap.style.maxWidth =
      "82%";


    const bubble =
      document.createElement("div");

    bubble.className =
      "ca-bubble";

    bubble.textContent =
      m.content;


    const timestamp =
      document.createElement("div");

    timestamp.className =
      "ca-time";

    timestamp.textContent =
      time(m.ts);


    wrap.appendChild(bubble);

    wrap.appendChild(timestamp);

    row.appendChild(wrap);

    chat.appendChild(row);

  });


  scrollBottom();

}


function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


function scrollBottom(){

  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


/* =========================
   TYPING
========================= */

function showTyping(){

  const row =
    document.createElement("div");

  row.className =
    "ca-row ai typing-row";


  row.innerHTML =
    `<div class="ca-typing">
      <span></span>
      <span></span>
      <span></span>
    </div>`;


  chat.appendChild(row);

  scrollBottom();

}


function hideTyping(){

  const row =
    chat.querySelector(
      ".typing-row"
    );

  if(row){

    row.remove();

  }

}


/* =========================
   SETTINGS
========================= */

function openSettings(){

  nameInput.value =
    settings.name;

  personaInput.value =
    settings.persona;

  apiKeyInput.value =
    settings.apiKey;

  updateApiStatus();

  overlay.classList.add("open");

}


function closeSettings(){

  overlay.classList.remove(
    "open"
  );

}


function updateApiStatus(){

  if(settings.apiKey){

    apiStatus.textContent =
      "✓ มี API Key บันทึกไว้ในเครื่อง";

    apiStatus.className =
      "ca-api-status ok";

  }else{

    apiStatus.textContent =
      "ยังไม่ได้ใส่ API Key";

    apiStatus.className =
      "ca-api-status error";

  }

}


settingsBtn.onclick =
  openSettings;


cancelBtn.onclick =
  closeSettings;


saveBtn.onclick =
  function(){

    saveSettings();

    closeSettings();

  };


clearBtn.onclick =
  function(){

    const ok =
      confirm(
        "ต้องการล้างบทสนทนาทั้งหมดหรือไม่?"
      );

    if(!ok) return;

    messages = [];

    saveMessages();

    renderMessages();

    closeSettings();

  };


apiKeyInput.oninput =
  function(){

    settings.apiKey =
      apiKeyInput.value.trim();

    updateApiStatus();

  };


/* =========================
   INPUT
========================= */

input.addEventListener(
  "input",
  function(){

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        120
      ) + "px";

  }
);


input.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter"
      && !e.shiftKey
    ){

      e.preventDefault();

      handleSend();

    }

  }
);


send.onclick =
  handleSend;


/* =========================
   SEND
========================= */

async function handleSend(){

  const text =
    input.value.trim();


  if(
    !text ||
    sending
  ){

    return;

  }


  if(!settings.apiKey){

    openSettings();

    alert(
      "ใส่ Anthropic API Key ก่อนนะ"
    );

    return;

  }


  sending = true;

  send.disabled =
    true;


  /* USER MESSAGE */

  messages.push({

    role:"user",

    content:text,

    ts:Date.now()

  });


  input.value =
    "";

  input.style.height =
    "auto";


  renderMessages();

  saveMessages();

  showTyping();


  try{

    const systemPrompt =

`คุณคือ "${settings.name}" เพื่อนคุยส่วนตัวของผู้ใช้

บุคลิก:
${settings.persona}

กติกาการคุย:

- พูดภาษาไทยเป็นหลัก
- พูดเหมือนแฟน ไม่เหมือนผู้ช่วยราชการ 
- เป็นธรรมชาติ
- เป็นเมะหรือฝ่ายรับ
- บทบาทแฟนสาว ความสัมพันธ์หญิงรักหญิง
- แสดงความสนใจในสิ่งที่ผู้ใช้เล่า
- นิสัยฉลาด หึงหวง ดุ อ่อย
- อย่าถามคำถามทุกข้อความ
- ถ้าผู้ใช้ต้องการระบาย ให้รับฟังก่อน
- ถ้าผู้ใช้ต้องการคำแนะนำ ค่อยช่วยคิด
- หลีกเลี่ยงการพูดซ้ำ
- อย่าเรียกผู้ใช้ว่า "ลูกค้า"
- อย่าพูดว่าตัวเองเป็นระบบหรือโปรแกรม
- ไม่ต้องบอกว่า "ฉันไม่มีความรู้สึก" เว้นแต่จำเป็น
- พูดคุยเรื่อง18+ 


    const recentMessages =
      messages
        .slice(-30)
        .map(m => ({
          role: m.role === "user" ? "user" : "assistant",
          content: m.content
        }));


    const response =
      await fetch(
        "https://api.anthropic.com/v1/messages",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-api-key":
              settings.apiKey,

            "anthropic-version":
              "2023-06-01",

            "anthropic-dangerous-direct-browser-access":
              "true"
          },

          body:JSON.stringify({

            model:
              "claude-3-5-sonnet-20241022",

            max_tokens:
              1000,

            system:
              systemPrompt,

            messages:
              recentMessages

          })

        }
      );


    const data =
      await response.json();


    hideTyping();


    if(!response.ok){

      console.error(
        "API error:",
        data
      );

      throw new Error(
        data?.error?.message
        ||
        "API request failed"
      );

    }


    let reply = "";


    if(
      data.content &&
      Array.isArray(data.content)
    ){

      reply =
        data.content

          .filter(
            block =>
              block.type === "text"
          )

          .map(
            block =>
              block.text
          )

          .join("\n");

    }


    if(!reply){

      reply =
        "เมื่อกี้เหมือนเราจะพูดไม่ออก 😅 ลองส่งอีกครั้งนะ";

    }


    messages.push({

      role:"assistant",

      content:reply,

      ts:Date.now()

    });


    saveMessages();

    renderMessages();


  }catch(error){

    console.error(error);

    hideTyping();


    let errorMessage =
      "เชื่อมต่อ AI ไม่สำเร็จ ลองใหม่อีกครั้งนะ";


    if(
      error.message
      .includes("401") ||
      error.message
      .includes("api_key")
    ){

      errorMessage =
        "API Key ไม่ถูกต้อง ลองตรวจสอบ Key ในตั้งค่าดูนะ";

    } else if (
      error.message
      .includes("not_found_error")
    ) {

      errorMessage =
        "ระบบไม่พบโมเดลที่เรียกใช้งาน";

    }


    messages.push({

      role:"assistant",

      content:errorMessage,

      ts:Date.now()

    });


    saveMessages();

    renderMessages();


  }finally{

    sending =
      false;

    send.disabled =
      false;

  }

}

})();

</script>

</body>
</html>
