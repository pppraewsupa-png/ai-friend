<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Friend</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
}

body{

background:#1B1830;

color:#F2EFEA;

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

}

.app{

height:100dvh;

display:flex;
flex-direction:column;

max-width:700px;

margin:auto;

background:#1B1830;

}

/* HEADER */

.header{

height:70px;

display:flex;
align-items:center;

padding:10px 16px;

background:#241F3D;

border-bottom:
1px solid rgba(255,255,255,.08);

}

.orb{

width:42px;
height:42px;

border-radius:50%;

margin-right:12px;

background:
radial-gradient(
circle at 30% 30%,
#E8A87C,
#B4744A
);

box-shadow:
0 0 18px
rgba(232,168,124,.2);

}

.info{
flex:1;
}

.name{

font-size:17px;
font-weight:600;

}

.status{

font-size:12px;

color:#8E88AC;

margin-top:2px;

}

.settings{

border:0;

background:none;

color:#8E88AC;

font-size:20px;

padding:8px;

}

/* CHAT */

.chat{

flex:1;

overflow-y:auto;

padding:16px;

display:flex;

flex-direction:column;

gap:10px;

}

.empty{

margin:auto;

text-align:center;

color:#8E88AC;

line-height:1.8;

font-size:14px;

}

.empty strong{

color:#F2EFEA;

}

/* MESSAGE */

.row{

display:flex;

width:100%;

}

.user{

justify-content:flex-end;

}

.ai{

justify-content:flex-start;

}

.bubble{

max-width:80%;

padding:
10px 14px;

border-radius:17px;

font-size:15px;

line-height:1.55;

white-space:pre-wrap;

}

.user .bubble{

background:#E8A87C;

color:#241708;

border-bottom-right-radius:5px;

}

.ai .bubble{

background:#2A2447;

border:
1px solid rgba(255,255,255,.08);

border-bottom-left-radius:5px;

}

/* INPUT */

.input-area{

display:flex;

gap:8px;

padding:10px 12px;

background:#241F3D;

border-top:
1px solid rgba(255,255,255,.08);

}

.input{

flex:1;

min-height:42px;

max-height:120px;

resize:none;

border:0;

outline:none;

border-radius:14px;

padding:11px 14px;

background:#2A2447;

color:#F2EFEA;

font-family:inherit;

font-size:15px;

}

.input::placeholder{

color:#8E88AC;

}

.send{

width:42px;
height:42px;

border:0;

border-radius:50%;

background:#E8A87C;

color:#241708;

font-size:17px;

}

</style>

</head>


<body>


<div class="app">


<!-- HEADER -->

<div class="header">

<div class="orb"></div>

<div class="info">

<div class="name">
เพื่อน
</div>

<div class="status">
พร้อมคุยด้วยเสมอ
</div>

</div>

<button class="settings">
⚙️
</button>

</div>


<!-- CHAT -->

<div class="chat" id="chat">

<div class="empty"
id="empty">

สวัสดี 👋

<br>

ที่นี่เป็นพื้นที่ส่วนตัวของคุณ

<br>

คุยอะไรก็ได้
<strong>เพื่อน</strong>
พร้อมรับฟังเสมอ

</div>

</div>


<!-- INPUT -->

<div class="input-area">

<textarea
class="input"
id="input"
placeholder="พิมพ์อะไรก็ได้..."
rows="1"></textarea>

<button
class="send"
id="send">

➤

</button>

</div>


</div>


<script>


const input =
document.getElementById("input");

const send =
document.getElementById("send");

const chat =
document.getElementById("chat");

const empty =
document.getElementById("empty");


/* SEND MESSAGE */

function sendMessage(){

const text =
input.value.trim();


if(!text)
return;


/* remove welcome */

if(empty){

empty.remove();

}


/* USER */

const userRow =
document.createElement("div");

userRow.className =
"row user";


const userBubble =
document.createElement("div");

userBubble.className =
"bubble";

userBubble.textContent =
text;


userRow.appendChild(
userBubble
);

chat.appendChild(
userRow
);


/* clear */

input.value="";

input.style.height="auto";


/* temporary AI reply */

setTimeout(()=>{

const aiRow =
document.createElement("div");

aiRow.className =
"row ai";


const aiBubble =
document.createElement("div");

aiBubble.className =
"bubble";

aiBubble.textContent =
"เราอยู่นี่นะ 😊 เล่าให้เราฟังต่อได้เลย";


aiRow.appendChild(
aiBubble
);

chat.appendChild(
aiRow
);


chat.scrollTop =
chat.scrollHeight;

},600);


chat.scrollTop =
chat.scrollHeight;

}


/* BUTTON */

send.addEventListener(
"click",
sendMessage
);


/* ENTER */

input.addEventListener(
"keydown",
function(e){

if(
e.key==="Enter"
&&
!e.shiftKey
){

e.preventDefault();

sendMessage();

}

});


/* AUTO HEIGHT */

input.addEventListener(
"input",
function(){

this.style.height =
"auto";

this.style.height =
Math.min(
this.scrollHeight,
120
)+"px";

});

</script>


</body>

</html>
